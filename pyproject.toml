[project]
name = "lineage"
version = "0.1.0"
description = "eBPF runtime detector for suspicious process spawning"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["lineage"]

[tool.black]
target-version = ["py311"]
line-length = 88
